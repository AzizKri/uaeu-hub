<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">

<head>
  <title></title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!--[if mso]>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
        <o:AllowPNG />
      </o:OfficeDocumentSettings>
    </xml>
  <![endif]-->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" type="text/css" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: inherit !important; }
    #MessageViewBody a { color: inherit; text-decoration: none; }
    p { line-height: inherit; }
    @media (max-width: 540px) {
      .card { width: 100% !important; border-radius: 0 !important; }
      .card-pad { padding: 32px 24px !important; }
      .h1 { font-size: 26px !important; }
    }
  </style>
</head>

<body style="background-color:#f6f6f6;margin:0;padding:0;-webkit-text-size-adjust:none;text-size-adjust:none;font-family:'Montserrat',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="background-color:#f6f6f6;">
    <tbody>
      <tr>
        <td align="center" style="padding:40px 16px;">

          <!-- Logo -->
          <table role="presentation" width="520" border="0" cellpadding="0" cellspacing="0" class="card" style="width:520px;max-width:520px;">
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <span style="font-family:'Montserrat',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:30px;font-weight:800;letter-spacing:-0.5px;color:#d7420c;">uaeu.chat</span>
              </td>
            </tr>
          </table>

          <!-- Card -->
          <table role="presentation" width="520" border="0" cellpadding="0" cellspacing="0" class="card" style="width:520px;max-width:520px;background-color:#ffffff;border:1px solid #e5e5e5;border-radius:16px;">
            <tr>
              <td class="card-pad" style="padding:44px 48px;">

                <h1 class="h1" style="margin:0 0 20px 0;color:#333333;font-family:'Montserrat',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;line-height:1.25;">{{heading}}</h1>

                <div style="color:#666666;font-family:'Montserrat',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:400;line-height:1.6;">
                  <p style="margin:0 0 28px 0;">{{intro}}</p>
                </div>

                <!-- Button -->
                <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="margin:0 0 28px 0;">
                  <tr>
                    <td align="center" bgcolor="#d7420c" style="border-radius:999px;">
                      <!--[if mso]>
                      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="{{actionUrl}}" style="height:48px;v-text-anchor:middle;width:240px;" arcsize="50%" fillcolor="#d7420c" stroke="f">
                        <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;">{{buttonText}}</center>
                      </v:roundrect>
                      <![endif]-->
                      <!--[if !mso]><!-->
                      <a href="{{actionUrl}}" target="_blank" style="display:inline-block;padding:15px 38px;font-family:'Montserrat',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:999px;background-color:#d7420c;">{{buttonText}}</a>
                      <!--<![endif]-->
                    </td>
                  </tr>
                </table>

                <div style="color:#999999;font-family:'Montserrat',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:400;line-height:1.6;">
                  <p style="margin:0 0 8px 0;">Button not working? Copy and paste this link into your browser:</p>
                  <p style="margin:0 0 28px 0;word-break:break-all;"><a href="{{actionUrl}}" target="_blank" style="color:#d7420c;text-decoration:none;">{{actionUrl}}</a></p>
                </div>

                <div style="border-top:1px solid #e5e5e5;padding-top:24px;color:#999999;font-family:'Montserrat',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;font-weight:400;line-height:1.6;">
                  <p style="margin:0;">{{footerNote}} Need help? Reach us at <a href="mailto:support@uaeu.chat" style="color:#d7420c;text-decoration:none;">support@uaeu.chat</a>.</p>
                </div>

              </td>
            </tr>
          </table>

          <!-- Footer -->
          <table role="presentation" width="520" border="0" cellpadding="0" cellspacing="0" class="card" style="width:520px;max-width:520px;">
            <tr>
              <td align="center" style="padding-top:24px;color:#999999;font-family:'Montserrat',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;font-weight:400;">
                <p style="margin:0;">&copy; uaeu.chat &mdash; the UAEU student community</p>
              </td>
            </tr>
          </table>

        </td>
      </tr>
    </tbody>
  </table>
</body>

</html>
